# Starship 'neon' — cyberdeck TUI layout. Thin slate frame, neon text, no filled blocks.
# Increase command timeout to prevent fnm warnings
command_timeout = 1000
add_newline = true

# Palette
#   frame   #4b5563   slate rails and brackets
#   cyan    #00e5ff   directory
#   green   #39ff14   git branch, prompt ok
#   magenta #ff2bd6   project badge, rebase/merge
#   amber   #ffb000   git status, duration, jobs
#   violet  #a78bfa   runtimes
#   red     #ff3b3b   deletions, prompt error
#   grey    #94a3b8   clock

format = '''
[┌─\[](#4b5563)${custom.project}$directory[\]](#4b5563)([─\[](#4b5563)$git_branch$git_status$git_state$git_metrics[\]](#4b5563))([─\[](#4b5563)$c$dotnet$golang$java$nodejs$python$rust[\]](#4b5563))$fill$jobs$cmd_duration[\[](#4b5563)$time[\]](#4b5563)
[└─](#4b5563)$character'''

[fill]
symbol = '─'
style = '#4b5563'

[character]
success_symbol = '[❯](bold #39ff14) '
error_symbol = '[❯](bold #ff3b3b) '

[directory]
style = 'fg:#7dd3fc'
format = '[$path]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
repo_root_style = 'bold fg:#00e5ff'
repo_root_format = '[$repo_root]($repo_root_style)[$path]($style)'

[git_branch]
symbol = ''
style = 'fg:#39ff14'
format = '[$symbol $branch]($style)'

[git_status]
style = 'fg:#ffb000'
conflicted = ' 🏳'
up_to_date = ''
untracked = ' ?'
ahead = ' ⇡${count}'
diverged = ' ⇕⇡${ahead_count}⇣${behind_count}'
behind = ' ⇣${count}'
stashed = ' $'
modified = ' !'
staged = ' +${count}'
renamed = ' »'
deleted = ' ✘'
format = '[$all_status$ahead_behind]($style)'

[git_state]
style = 'bold fg:#ff2bd6'
format = '[ $state( $progress_current/$progress_total)]($style)'

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = 'fg:#39ff14'
deleted_style = 'fg:#ff3b3b'
format = '( [+$added]($added_style))( [-$deleted]($deleted_style))'

[c]
symbol = 'c'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[dotnet]
symbol = '.net'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'
detect_files = ['global.json', 'project.json', 'Directory.Build.props', 'Directory.Build.targets', 'Packages.props']
detect_extensions = ['csproj', 'fsproj', 'xproj', 'sln']

[golang]
symbol = 'go'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[java]
symbol = 'java'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[nodejs]
symbol = 'node'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[python]
symbol = 'py'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[rust]
symbol = 'rs'
style = 'fg:#a78bfa'
format = '[$symbol]($style)'

[jobs]
symbol = 'bg'
number_threshold = 1
format = '[$symbol:$number ](bold #ffb000)'

[cmd_duration]
min_time = 1
format = '[$duration ](#ffb000)'

[time]
disabled = false
time_format = '%R'
style = 'fg:#94a3b8'
format = '[$time]($style)'

[username]
disabled = true

[hostname]
disabled = true

# Project badge: a glyph per project, Apple elsewhere. Matched by path prefix so
# every checkout (-1, -2, -ci) of a project shows the same badge.
[custom.project]
when = true
shell = ['sh']
command = '''
case "$PWD" in
  */reignition-studio/word-mage*)   printf '\356\236\254' ;;  # U+E7AC dev-crystal
  */reignition-studio/tidal-front*) printf '\357\204\275' ;;  # U+F13D anchor
  */plattnum-public-oss/cera*)      printf '\357\200\255' ;;  # U+F02D book
  *)                                printf '\357\205\271' ;;  # U+F179 apple
esac
'''
style = 'fg:#ff2bd6'
format = '[$output ]($style)'
