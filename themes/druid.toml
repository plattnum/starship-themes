# Starship 'druid' palette, Viking layout
# Increase command timeout to prevent fnm warnings
command_timeout = 1000

format = """
[ ](#e8f5e9)\
[ ](bg:#1b5e20)\
${custom.project}\
$username\
[](bg:#2e7d32 fg:#1b5e20)\
[ ](bg:#2e7d32 fg:#e8f5e9)\
$directory\
[](fg:#2e7d32 bg:#43a047)\
$git_branch\
$git_status\
$git_state\
$git_metrics\
[](fg:#43a047 bg:#66bb6a)\
$c\
$dotnet\
$golang\
$java\
$nodejs\
$python\
$rust\
[](fg:#66bb6a bg:#e8f5e9)\
$time\
[ ](fg:#e8f5e9)\
$fill\
$jobs\
$cmd_duration\
$hostname\
$line_break\
$character"""

# Disable the blank line at the start of the prompt
add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "fg:#e8f5e9 bg:#1b5e20"
style_root = "fg:#e8f5e9 bg:#1b5e20"
format = '[$user ](bold $style)'
disabled = true

[cmd_duration]
min_time = 1
format = 'took [$duration](bold #b9f6ca)'

[character]
success_symbol = '[](bold green) '
error_symbol = '[](bold red) '

[hostname]
ssh_only = false
format = ' [$hostname](#43a047) '
disabled = true

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#9A348E"
disabled = true # Disabled by default

[directory]
style = "fg:#b9f6ca bg:#2e7d32"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
repo_root_style = "bold fg:#e8f5e9 bg:#2e7d32"
repo_root_format = "[ ]($style)[$repo_root]($repo_root_style)[$path ]($style)"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = " "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[fill]
symbol = ' '

[c]
symbol = ""
style = "bg:#66bb6a"
format = '[ $symbol ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style) $path'

[git_branch]
symbol = ""
style = "fg:#0b2e13 bg:#43a047"
format = '[ $symbol $branch ]($style)'


[git_status]
style = "fg:#b9f6ca bg:#43a047"
conflicted = "🏳"
up_to_date = " "
untracked = " "
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
stashed = ""
modified = " "
staged = '[++\($count\)](fg:#0b2e13 bg:#43a047)'
renamed = "襁"
deleted = ""
format = '[$all_status$ahead_behind](bold $style)'

[git_state]
style = "bold fg:#ffd54f bg:#43a047"
format = '[ $state( $progress_current/$progress_total) ]($style)'

[git_metrics]
disabled = false
only_nonzero_diffs = true
added_style = "fg:#0b2e13 bg:#43a047"
deleted_style = "fg:#0b2e13 bg:#43a047"
format = '([+$added ]($added_style))([-$deleted ]($deleted_style))'

[dotnet]
symbol = ".NET"
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'
detect_files = ["global.json", "project.json", "Directory.Build.props", "Directory.Build.targets", "Packages.props"]
detect_extensions = ["csproj", "fsproj", "xproj", "sln"]

[jobs]
symbol = "bg"
number_threshold = 1
format = '[$symbol:$number ](bold #b9f6ca)'

[golang]
symbol = "go"
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'

[java]
symbol = ""
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'

[nodejs]
symbol = ""
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'

[python]
# Display the version of python from inside a local venv.
#
# Note this will only work when the venv is inside the project and it will only
# work in the directory that contains the venv dir but maybe this is ok?
symbol = ' '
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'

[rust]
symbol = ""
style = "fg:#0b2e13 bg:#66bb6a"
format = '[ $symbol ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "fg:#0b2e13 bg:#e8f5e9"
format = '[  $time ]($style)'

# Project badge: a glyph per project, Apple elsewhere. Matched by path prefix so
# every checkout (-1, -2, -ci) of a project shows the same badge.
[custom.project]
when = true
shell = ["sh"]
command = '''
case "$PWD" in
  */reignition-studio/word-mage*)   printf '\356\236\254' ;;  # U+E7AC dev-crystal
  */reignition-studio/tidal-front*) printf '\357\204\275' ;;  # U+F13D anchor
  */plattnum-public-oss/cera*)      printf '\357\200\255' ;;  # U+F02D book
  *)                                printf '\357\205\271' ;;  # U+F179 apple
esac
'''
style = "fg:#e8f5e9 bg:#1b5e20"
format = '[ $output ]($style)'
